services:
  - type: web
    name: nexus-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/meta
    envVars:
      - key: PORT
        value: "10000"
      - key: LOW_MEM_MODE
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
